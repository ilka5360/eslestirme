name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: APK derle
        run: bash mobile/build.sh
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - name: Sürüm etiketini güncelle
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -f android-latest
          git push -f origin android-latest
      - name: Yayınla (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Eşle Android (APK)
          body: |
            Android için son Eşle sürümü. Telefonda `Esle.apk` dosyasına dokunup kurun (bilinmeyen kaynaklara izin vermeniz istenebilir). Yeni sürüm, eskisinin üzerine veri kaybı olmadan kurulur.
          files: mobile/out/Esle.apk
          make_latest: true
